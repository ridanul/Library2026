<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>KiU Library System - Home</title>
	<link rel="stylesheet" href="css/index.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="js/tailwind.config.js"><script/>
	<link rel="stylesheet" href="css/styles.css" />
</head>

<body class="paper-texture min-h-screen bg-gray-50">
	<!-- Header & Navigation -->
	<header class="bg-white border-b border-ink/10 shadow-sm sticky top-0 z-50">
		<div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
			<div id="headerContent" class="flex flex-col gap-3 sm:flex-row items-center justify-between">
				<div class="flex items-center gap-3 sm:gap-4 min-w-0">
					<img src="./kiu_logo.png" alt="KiU Library Logo" class="h-10 w-10 sm:h-12 sm:w-12 object-contain" />
					<h1 class="font-display text-2xl sm:text-3xl font-bold text-ink whitespace-nowrap">KiU Library</h1>
					<p class="hidden md:block text-xs text-charcoal/60 font-mono truncate">Knowledge · Information ·
						Understanding</p>
				</div>
				<nav id="guestNav" class="flex flex-wrap items-center gap-3 sm:gap-6 text-sm justify-between">
					<a href="#"
						class="text-ink hover:text-brass transition md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md ">Catalog</a>
					<a href="#"
						class="text-ink hover:text-brass transition md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md ">Resources</a>
					<a href="#"
						class="text-ink hover:text-brass transition md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md ">About</a>
					<a href="login.html" class="text-ink md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md">Sign in</a>
					<a href="login.html"
						class="text-ink md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md ">Register</a>
				</nav>
				<nav id="userNav" class="hidden flex flex-wrap items-center gap-3 sm:gap-6 text-sm">
					<a href="dashboard.html"
						class="text-[10px] sm:text-sm font-mono w-15 border border-ink/20 rounded px-2 py-1 hover:bg-parchmentDark transition">Dashboard</a>
						<!-- class="text-ink hover:text-brass transition md:hover:bg-blue-300 md:py-1 md:px-2 rounded-md ">Dashboard</a> -->
				</nav>
			</div>
		</div>
	</header>

	<!-- Main Content -->
	<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
		<!-- Hero Search Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="text-2xl font-bold text-ink mb-3">Search the Library Catalog</h2>
			<p class="text-sm text-charcoal/60 mb-4">Find books, journals, and resources by title, author, or ISBN.</p>
			<form id="landingSearch" class="flex flex-col sm:flex-row gap-3">
				<input id="landingQuery" type="text" placeholder="Search books, journals, or authors…"
					class="flex-1 border border-ink/20 rounded px-4 py-3 focus:outline-none focus:border-ink" />
				<button
					class="bg-ink text-parchment px-6 py-3 rounded font-semibold hover:bg-opacity-90 transition">Search</button>
			</form>
		</section>

		<!-- Carousel Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10 relative z-0">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-4">Library Highlights</h2>
			<div class="carousel-container">
				<div class="carousel-slide active">
					<h3>📚 Welcome to KiU Library</h3>
					<p>Discover thousands of academic resources, journals, and books curated for your learning needs.
					</p>
				</div>
				<div class="carousel-slide">
					<h3>🎓 Digital Resources</h3>
					<p>Access e-journals and e-books from leading academic publishers and databases.</p>
				</div>
				<div class="carousel-slide">
					<h3>🔍 Advanced Search</h3>
					<p>Find exactly what you need with our powerful search and filtering capabilities.</p>
				</div>
				<div class="carousel-controls">
					<button class="carousel-btn" onclick="changeSlide(-1)">← Previous</button>
					<button class="carousel-btn" onclick="changeSlide(1)">Next →</button>
				</div>
			</div>
		</section>

		<!-- E-Journals Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-2">Subscribed E-Journals</h2>
			<p class="text-xs text-charcoal/60 mb-4">Access leading academic journals and publications</p>
			<div class="resources-grid">
				<div class="resource-card">
					<div class="resource-logo text-4xl">🔬</div>
					<div class="resource-name">IEEE</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📖</div>
					<div class="resource-name">Nature</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📚</div>
					<div class="resource-name">Science Direct</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📰</div>
					<div class="resource-name">JSTOR</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">🌐</div>
					<div class="resource-name">Taylor & Francis</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📝</div>
					<div class="resource-name">Emerald</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
			</div>
		</section>

		<!-- E-Books Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-2">Subscribed E-Books</h2>
			<p class="text-xs text-charcoal/60 mb-4">Comprehensive collection of digital books from top publishers</p>
			<div class="resources-grid">
				<div class="resource-card">
					<div class="resource-logo text-4xl">📘</div>
					<div class="resource-name">Springer</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📗</div>
					<div class="resource-name">Sage</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📕</div>
					<div class="resource-name">McGraw Hill</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📙</div>
					<div class="resource-name">Elsevier</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📔</div>
					<div class="resource-name">Wiley</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
				<div class="resource-card">
					<div class="resource-logo text-4xl">📓</div>
					<div class="resource-name">ProQuest</div>
					<a href="#" class="visit-btn">Visit</a>
				</div>
			</div>
		</section>

		<!-- Library Information Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-6">Library Information</h2>
			<div class="info-grid">
				<div class="info-card">
					<h3>📞 Contact</h3>
					<p><strong>Librarian (In-Charge)</strong></p>
					<p>Email: library@kiu.ac.bd</p>
					<p>Phone: 02-9988 32221</p>
					<p>Ext: 671</p>
				</div>
				<div class="info-card">
					<h3>💻 IT Support</h3>
					<p><strong>Technical Assistance</strong></p>
					<p>Email: registrar@kiu.ac.bd</p>
					<p>Phone: 02-9988 32221</p>
					<p>Hours: 9:00 AM - 4:00 PM</p>
				</div>
				<div class="info-card">
					<h3>📍 Location</h3>
					<p><strong>Central Library</strong></p>
					<p>Kishoreganj University</p>
					<p>Gurudayal Govt. College</p>
					<p>Kishoreganj Sadar-2300, Bangladesh</p>
				</div>
			</div>
		</section>

		<!-- Library Hours Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-4">Library Hours</h2>
			<div class="overflow-x-auto">
				<table class="hours-table">
					<thead>
						<tr>
							<th>Day</th>
							<th>Hours</th>
							<th>Notes</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>Saturday - Wednesday</td>
							<td>9:00 AM - 5:00 PM</td>
							<td>Regular hours</td>
						</tr>
						<tr>
							<td>Launch & Prayer Break</td>
							<td>1:30 PM - 3:00 PM</td>
							<td>Closed for break</td>
						</tr>
						<tr>
							<td>Reference Section</td>
							<td>8:00 AM - 9:00 PM</td>
							<td>Extended hours</td>
						</tr>
						<tr>
							<td>Thursday & Friday</td>
							<td>Closed</td>
							<td>Weekly holiday</td>
						</tr>
						<tr>
							<td>Government Holidays</td>
							<td>Closed</td>
							<td>All day</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>

		<!-- Latest Notices Section -->
		<section class="bg-white rounded-lg p-8 shadow-md mb-8 border border-ink/10">
			<h2 class="font-mono text-sm text-brass uppercase font-bold mb-4">Latest Notices</h2>
			<div id="notices" class="space-y-3">
				<div class="p-4 border-l-4 border-brass rounded bg-parchment/40">
					<p class="font-semibold text-sm mb-1">New Arrivals Available</p>
					<p class="text-xs text-charcoal/70">New books in Science, Technology, and Engineering sections are
						now available for checkout.</p>
				</div>
				<div class="p-4 border-l-4 border-brass rounded bg-parchment/40">
					<p class="font-semibold text-sm mb-1">E-Journal Access Update</p>
					<p class="text-xs text-charcoal/70">All subscribed e-journals are now accessible with your library
						account credentials.</p>
				</div>
				<div class="p-4 border-l-4 border-brass rounded bg-parchment/40">
					<p class="font-semibold text-sm mb-1">Library Policies</p>
					<p class="text-xs text-charcoal/70">Loan period: 14 days. Fines accrue per day for overdue items.
						Admin approval required for student accounts.</p>
				</div>
			</div>
		</section>
	</main>

	<!-- Footer -->
	<footer class="bg-ink text-parchment py-8 mt-12 border-t border-ink/20">
		<div class="max-w-7xl mx-auto px-4 sm:px-6">
			<div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-6">
				<div>
					<h3 class="font-bold text-sm mb-2">About KiU Library</h3>
					<p class="text-xs opacity-80">Providing access to knowledge and information resources for the
						Kishoreganj University community.</p>
				</div>
				<div>
					<h3 class="font-bold text-sm mb-2">Quick Links</h3>
					<ul class="text-xs space-y-1 opacity-80">
						<li><a href="#" class="hover:underline">Catalog</a></li>
						<li><a href="#" class="hover:underline">E-Resources</a></li>
						<li><a href="#" class="hover:underline">Contact</a></li>
					</ul>
				</div>
				<div>
					<h3 class="font-bold text-sm mb-2">Social Links</h3>
					<p class="text-xs opacity-80">Follow us for updates and announcements</p>
				</div>
			</div>
			<div class="border-t border-parchment/20 pt-4 text-xs opacity-70 text-center">
				<p>© 2026 Kishoreganj University Library. All rights reserved.</p>
			</div>
		</div>
	</footer>
	<script src="js/index.js"></script>
</body>
</html>
